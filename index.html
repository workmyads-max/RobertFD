    <!-- ── Structured Data: FAQPage ─────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a proprietary trading firm?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A proprietary trading firm (prop firm) provides traders with funded capital to trade financial markets. Traders keep a percentage of the profits they generate, typically 80% to 90%, while the firm absorbs the losses within defined risk limits."
          }
        },
        {
          "@type": "Question",
          "name": "How do I get a funded trading account with XFunded Trader?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Choose a challenge type (one-step, two-step, or instant funding), select your account size from $5K to $200K, complete the checkout, and pass the evaluation by reaching the profit target without breaching the drawdown limits. Once passed, you receive a funded MT5 account."
          }
        },
        {
          "@type": "Question",
          "name": "What profit split does XFunded Trader offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "XFunded Trader offers up to 90% profit split on funded accounts. The exact split depends on the challenge type selected, with one-step challenges offering the highest 90% reward split."
          }
        },
        {
          "@type": "Question",
          "name": "What trading platform does XFunded Trader use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "XFunded Trader provides funded accounts on MetaTrader 5 (MT5), the industry-standard platform for forex and CFD trading with advanced charting, automated trading, and multi-device access."
          }
        },
        {
          "@type": "Question",
          "name": "What is the maximum account size available?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "XFunded Trader offers funded account sizes ranging from $5,000 up to $200,000. Traders can scale their capital as they demonstrate consistent profitability."
          }
        },
        {
          "@type": "Question",
          "name": "Are there time limits on the evaluation challenges?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. XFunded Trader evaluation challenges have no time limits. You can trade at your own pace and pass the profit target whenever you achieve it, provided you stay within the drawdown rules."
          }
        },
        {
          "@type": "Question",
          "name": "How fast can I withdraw my profits?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Instant funding accounts offer immediate payout eligibility once consistency and profitable day requirements are met. Funded account payouts are processed within 1 to 3 business days via USDT (TRC20) or bank transfer."
          }
        },
        {
          "@type": "Question",
          "name": "What payment methods are accepted?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "XFunded Trader accepts USDT (TRC20), Bitcoin, and major credit/debit cards via secure payment gateways. Cryptocurrency payments are verified automatically on the blockchain."
          }
        }
      ]
    }
    </script>
